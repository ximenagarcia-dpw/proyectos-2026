<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Grid CSS</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <h1>Ejemplos de Grid Layout CSS</h1>

    <h2>1 columna</h2>

    <div class="grid grid-1-columna">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
    </div>

    <hr>

    <h2>2 columnas</h2>

    <div class="grid grid-2-columnas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
    </div>

    <hr>

    <h2>3 columnas</h2>

    <div class="grid grid-3-columnas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
        <div class="cuadro">5</div>
        <div class="cuadro">6</div>
    </div>

    <hr>

    <h2>4 columnas</h2>

    <div class="grid grid-4-columnas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
    </div>

    <hr>

    <h2>2 filas</h2>

    <div class="grid grid-2-filas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
    </div>

    <hr>

    <h2>3 filas</h2>

    <div class="grid grid-3-filas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
    </div>

    <hr>

    <h2>4 filas</h2>

    <div class="grid grid-4-filas">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
    </div>

    <hr>

    <h2>Large Grid</h2>

    <div class="grid large-grid">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
        <div class="cuadro">5</div>
        <div class="cuadro">6</div>
    </div>

    <hr>

    <h2>Small Grid</h2>

    <div class="grid small-grid">
        <div class="cuadro">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
        <div class="cuadro">5</div>
        <div class="cuadro">6</div>
        <div class="cuadro">7</div>
        <div class="cuadro">8</div>
        <div class="cuadro">9</div>
        <div class="cuadro">10</div>
        <div class="cuadro">11</div>
        <div class="cuadro">12</div>
    </div>

    <hr>

    <h2>Mosaico 1</h2>

    <div class="grid mosaico-1">
        <div class="cuadro grande">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
    </div>

    <hr>

    <h2>Mosaico 2</h2>

    <div class="grid mosaico-2">
        <div class="cuadro superior">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
    </div>

    <hr>

    <h2>Mosaico 3</h2>

    <div class="grid mosaico-3">
        <div class="cuadro principal">1</div>
        <div class="cuadro">2</div>
        <div class="cuadro">3</div>
        <div class="cuadro">4</div>
    </div>

</body>

</html>
